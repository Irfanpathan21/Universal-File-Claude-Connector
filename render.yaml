# Render Blueprint for Universal File Toolkit (100% Free Tier)
services:
  # 1. MCP Server (SSE for Claude Web, Mobile & Desktop)
  - type: web
    name: uft-mcp-server
    runtime: node
    plan: free
    branch: main
    buildCommand: npx -y pnpm@9.12.0 install && npx -y pnpm@9.12.0 build
    startCommand: node packages/mcp-server/dist/index.js --sse
    envVars:
      - key: TRANSPORT
        value: sse
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production

  # 2. Backend REST API
  - type: web
    name: uft-api-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npx -y pnpm@9.12.0 install && npx -y pnpm@9.12.0 build
    startCommand: node packages/backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production

  # 3. Web App Frontend (Static Site - Free)
  - type: web
    name: uft-frontend-app
    runtime: static
    branch: main
    buildCommand: npx -y pnpm@9.12.0 install && npx -y pnpm@9.12.0 --filter @uft/frontend build
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
