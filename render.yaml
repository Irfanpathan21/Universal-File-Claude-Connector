# Render Blueprint for Universal File Toolkit (100% Free Tier)
services:
  # 1. MCP Server (SSE for Claude Web, Mobile & Desktop)
  - type: web
    name: uft-mcp-server
    runtime: node
    plan: free
    branch: last
    buildCommand: (python3 -m pip install --no-cache-dir pymupdf Pillow pypdf || true) && NODE_ENV=development npx -y pnpm@9.12.0 install --no-frozen-lockfile --prod=false && npx -y pnpm@9.12.0 run build:mcp
    startCommand: node packages/mcp-server/dist/index.js --sse
    healthCheckPath: /health
    envVars:
      - key: TRANSPORT
        value: sse
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production

  # 2. Backend REST API
  - type: web
    name: uft-api-backend
    runtime: node
    plan: free
    branch: last
    buildCommand: (python3 -m pip install --no-cache-dir pymupdf Pillow pypdf || true) && NODE_ENV=development npx -y pnpm@9.12.0 install --no-frozen-lockfile --prod=false && npx -y pnpm@9.12.0 run build:backend
    startCommand: node packages/backend/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production

  # 3. Web App Frontend (Static Site - https://uftapp.onrender.com)
  - type: web
    name: uftapp
    runtime: static
    branch: last
    buildCommand: NODE_ENV=development npx -y pnpm@9.12.0 install --no-frozen-lockfile --prod=false && npx -y pnpm@9.12.0 run build:frontend
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
