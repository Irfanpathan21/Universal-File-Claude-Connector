name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Executables & Packages
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-executables.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Universal File Toolkit ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Universal File Toolkit ${{ github.ref_name }}
            
            ### ✨ What's Included:
            - **Windows Setup Package**: Double-click `Setup.exe` to configure and launch.
            - **Searchable Desktop App**: Registers into Windows Search and Desktop.
            - **100 Active Tools**: PDF, Image, Spreadsheet, Document, OCR, Data, and AI processing.
            - **Claude Desktop Integration**: Connects seamlessly via Model Context Protocol.
            - **Live Web App**: [https://uftapp.onrender.com](https://uftapp.onrender.com)
            
            ### 📦 Direct Downloads:
            - **`UniversalFileToolkit-Setup.zip`**: Complete Windows setup & launcher bundle.
            - **`Setup.exe`**: 1-click Windows Installer wizard.
          files: |
            UniversalFileToolkit-Setup.zip
            Setup.exe
