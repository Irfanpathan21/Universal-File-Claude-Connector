name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Executables & Packages
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-executables.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Universal File Toolkit ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Universal File Toolkit ${{ github.ref_name }}
            
            ### ✨ What's New in this Release:
            - 🛡️ **Strict File Type Validation**: Both frontend dropzones and backend endpoints now strictly enforce allowed file formats across all 100 tools (e.g. PDF tools accept only `.pdf`, image tools accept only `.png`/`.jpg`/`.webp`, etc.), preventing invalid file uploads and runtime processing errors.
            - ⚡ **Defender & SmartScreen-Safe 1-Click Setup**: Added `Setup-OneClick.cmd` & `setup.ps1` that run seamlessly without triggering Windows Defender or SmartScreen false-positive warnings.
            - 🖥️ **Searchable Desktop App**: Auto-configures Desktop and Start Menu shortcuts, indexed in Windows Search.
            - 🤖 **Claude Desktop MCP Integration**: 100 active tools seamlessly accessible through Model Context Protocol.
            - 🌐 **Live Web App**: [https://uftapp.onrender.com](https://uftapp.onrender.com)
            
            ### 📦 Download:
            - **`UniversalFileToolkit-Setup.zip`**: Complete Windows setup & launcher bundle.
            
            ### 🛠️ How to Install on Windows:
            1. **Option 1 (Recommended — Defender-Safe 1-Click Setup)**: Extract zip and double-click `Setup-OneClick.cmd` (or `Install.cmd`).
            2. **Option 2 (GUI Setup Wizard)**: Double-click `Setup.exe` and follow wizard.
            3. **Option 3 (CLI Package)**: Run `npm start` or `node bin/uft.js`.
          files: |
            UniversalFileToolkit-Setup.zip
